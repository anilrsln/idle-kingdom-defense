<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Idle Kingdom Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      /* Mobilde double-tap zoom ve metin seçimini engelle */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* iOS Safari çentik güvenli alanı */
      min-height: 100dvh;
    }
    #game-container {
      border: 2px solid #16213e;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      line-height: 0;
    }
    /* ── Portre uyarısı: telefonu çevir ── */
    #rotate-notice {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1a1a2e;
      color: #ffd700;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      font-family: monospace;
      gap: 18px;
    }
    #rotate-notice .phone {
      font-size: 64px;
      animation: rotatePhone 1.8s ease-in-out infinite;
    }
    #rotate-notice .title { font-size: 20px; color: #fff; font-weight: bold; }
    #rotate-notice .sub   { font-size: 13px; color: #9999bb; max-width: 280px; line-height: 1.5; }
    @keyframes rotatePhone {
      0%, 40%   { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }
    /* Yalnızca dar + portre ekranlarda göster (gerçek mobil).
       Geniş masaüstü portre pencereleri etkilenmesin diye max-width sınırı. */
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-notice { display: flex; }
      #game-container { display: none; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="rotate-notice">
    <div class="phone">📱</div>
    <div class="title">Telefonu Yan Çevir</div>
    <div class="sub">Idle Kingdom Defense yatay modda oynanır. Daha iyi bir deneyim için cihazını yan çevir.</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
